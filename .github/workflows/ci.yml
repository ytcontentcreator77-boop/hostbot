name: HostPilot CI
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Validate setup script
        run: bash -n scripts/setup.sh
      - name: Validate control plane
        run: |
          npm install
          npm run typecheck
          npm run build
          npx wrangler d1 migrations apply hostpilot --local
      - name: Validate VPS agent
        working-directory: agent
        run: |
          npm install
          npm run build
